name: APICURON contribution tracking
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  track:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: Mehdi-SK/contribution-event-tracker@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          apicuron-url: ${{ secrets.APICURON_URL }}
          apicuron-token: ${{ secrets.APICURON_TOKEN }}
          dry-run: true
